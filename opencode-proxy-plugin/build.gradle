dependencies {
    // ProxyPlugin/RoutingProfile/RateLimitInfo come from the host's classpath at runtime (the
    // example-server's ProxyRegistry classloader already has :routing), compileOnly keeps this jar thin.
    githubCompileOnly "forebay:basekit:5.0.0:proxy-contracts"
    // :proxy-contracts keeps api compileOnly, which does not propagate, so the seam types this
    // plugin names in its own signatures are declared again here.
    githubCompileOnly "weivel:java:1.8.0:contract"
    githubTestImplementation "forebay:basekit:5.0.0:proxy-contracts"
    githubTestImplementation "weivel:java:1.8.0:contract"
}

// Version-less jar name so publishGithub's artifacts{} can reference it by a stable path.
jar { archiveVersion = "" }

publishGithub {
    owner = "forebay"
    repo = "opencode-proxy"
    releaseName = "OpenCode proxy ${project.findProperty('artifact_version') ?: project.version}"
    artifacts {
        artifact {
            classifier = "proxy"          // -> asset name opencode-proxy-proxy.jar (matches *-proxy*.jar org-scan)
            jar = file("build/libs/opencode-proxy-plugin.jar")
        }
    }
}
